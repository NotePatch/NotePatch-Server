server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location ~ "^/np-[0-9a-f]{32}/api/v1/" {
    rewrite "^/np-[0-9a-f]{32}(/api/v1/.*)$" $1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/v1/ {
    proxy_pass http://api:8000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ "^/np-[0-9a-f]{32}/health$" {
    rewrite "^/np-[0-9a-f]{32}/health$" /health break;
    proxy_pass http://api:8000;
  }

  location /health {
    proxy_pass http://api:8000/health;
  }

  location ~ "^/np-[0-9a-f]{32}/" {
    rewrite "^/np-[0-9a-f]{32}/(.*)$" /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
