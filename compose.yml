name: notepatch-server

x-backend: &backend
  image: notepatch-backend:local
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
    args:
      RELEASE_REVISION: ${GIT_SHA:-dev}
      RELEASE_BUILD_TIME: ${BUILD_TIME:-unknown}
      SCHEMA_REVISION: 202608220003
  env_file:
    - path: .env
      required: false
  environment:
    NOTEPATCH_DATA_ROOT: ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}
    OPENCLAW_ASSET_ROOT: /opt/notepatch/openclaw
    OPENCLAW_USER_RUNTIME_ROOT: ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
    PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-}
    CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  api:
    <<: *backend
    command: uvicorn notepatch.entrypoints.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "0.0.0.0:${API_PORT:-8001}:8000"
    volumes:
      - tusd_data:/tusd-data:ro
      - ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}:${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
      - ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}/avatars:${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      embedding-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: python -m notepatch.entrypoints.worker --queues default
    restart: unless-stopped
    environment:
      NOTEPATCH_DATA_ROOT: ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}
      OPENCLAW_ASSET_ROOT: /opt/notepatch/openclaw
      OPENCLAW_USER_RUNTIME_ROOT: ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
      WORKER_QUEUES: default
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
    volumes:
      - ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}:${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
      - ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}/avatars:${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      embedding-service:
        condition: service_started

  chat-worker:
    <<: *backend
    command: python -m notepatch.entrypoints.worker
    restart: unless-stopped
    environment:
      NOTEPATCH_DATA_ROOT: ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}
      OPENCLAW_ASSET_ROOT: /opt/notepatch/openclaw
      OPENCLAW_USER_RUNTIME_ROOT: ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
      WORKER_QUEUES: ${CHAT_WORKER_QUEUES:-chat}
    volumes:
      - ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}:${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      embedding-service:
        condition: service_started

  ai-worker:
    <<: *backend
    command: python -m notepatch.entrypoints.worker
    restart: unless-stopped
    environment:
      NOTEPATCH_DATA_ROOT: ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}
      OPENCLAW_ASSET_ROOT: /opt/notepatch/openclaw
      OPENCLAW_USER_RUNTIME_ROOT: ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
      WORKER_QUEUES: ${AI_WORKER_QUEUES:-ai}
    volumes:
      - ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}:${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      embedding-service:
        condition: service_started

  ocr-worker:
    profiles: ["ocr"]
    build:
      context: .
      dockerfile: infra/docker/ocr-worker.Dockerfile
    command: sh -lc "python -m notepatch.entrypoints.ocr_healthcheck && python -m notepatch.entrypoints.worker --queues ocr"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NOTEPATCH_DATA_ROOT: ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}
      OPENCLAW_ASSET_ROOT: /opt/notepatch/openclaw
      OPENCLAW_USER_RUNTIME_ROOT: ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
      WORKER_QUEUES: ${OCR_WORKER_QUEUES:-ocr}
      OCR_ENGINE: paddleocr
      PADDLEOCR_USE_GPU: "true"
      FLAGS_allocator_strategy: auto_growth
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - paddleocr-cache:/models/paddlex
      - ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}:${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      docserver:
        condition: service_healthy
      converter:
        condition: service_healthy
      embedding-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/notepatch-ocr-worker-ready && python -c 'from notepatch.modules.documents.ocr.paddle_structure_engine import _assert_cuda_runtime; _assert_cuda_runtime()'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s

  openclaw-supervisor:
    <<: *backend
    command: python -m notepatch.entrypoints.supervisor
    restart: unless-stopped
    volumes:
      - ${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}:${OPENCLAW_USER_RUNTIME_ROOT:-/home/usr/notepatch-data/openclaw}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  openclaw-sandbox-image:
    profiles: ["tools"]
    image: ${OPENCLAW_SANDBOX_IMAGE:-notepatch-openclaw-sandbox:filetools-v1}
    build:
      context: .
      dockerfile: infra/docker/openclaw-sandbox.Dockerfile
    command: ["notepatch-file", "self-test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  docserver:
    build:
      context: .
      dockerfile: infra/docker/doctr.Dockerfile
    image: notepatch-doctr:local
    restart: unless-stopped
    gpus: all
    environment:
      DOCSERVER_BASE_DIR: /opt/notepatch/services/doctr
      DOCSERVER_ILL_BATCH_SIZE: "64"
      DOCSERVER_PNG_COMPRESS_LEVEL: "1"
      DOCSERVER_UNLOAD_MODELS_AFTER_REQUEST: ${DOCSERVER_UNLOAD_MODELS_AFTER_REQUEST:-true}
      DOCTR_ROOT: /opt/notepatch/services/doctr/vendor/DocTr
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}/models/doctr:/opt/notepatch/services/doctr/vendor/DocTr/model_pretrained:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import torch, urllib.request; assert torch.cuda.is_available() and torch.cuda.device_count() > 0; r=urllib.request.urlopen('http://localhost:8000/healthz'); assert b'weights_ready' in r.read()"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  embedding-service:
    build:
      context: .
      dockerfile: infra/docker/embedding.Dockerfile
    image: notepatch-embedding:local
    restart: unless-stopped
    gpus: all
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /models/huggingface
    volumes:
      - bge-cache:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/healthz')); assert data.get('ok') is True"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s

  converter:
    build:
      context: .
      dockerfile: infra/docker/converter.Dockerfile
    image: notepatch-converter:local
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10

  clamav:
    profiles:
      - security
    image: clamav/clamav:1.4
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  admin-web:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_PATH_PREFIX:-}/api/v1
        VITE_PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-/}
    restart: unless-stopped
    ports:
      - "0.0.0.0:${ADMIN_WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  backup:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: infra/docker/backup.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_PLAIN: postgresql://${POSTGRES_USER:-notepatch}:${POSTGRES_PASSWORD:-notepatch}@postgres:5432/${POSTGRES_DB:-notepatch}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-notepatch}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-notepatch-secret}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-notepatch}
      AWS_DEFAULT_REGION: us-east-1
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-change-me-restic-password}
      SCHEMA_REVISION: 202608220003
      RELEASE_REVISION: ${GIT_SHA:-dev}
    volumes:
      - ${NOTEPATCH_DATA_ROOT:-/home/usr/notepatch-data}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started

  prometheus:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: infra/docker/prometheus.Dockerfile
    image: notepatch-prometheus:local
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: infra/docker/grafana.Dockerfile
    image: notepatch-grafana:local
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "0.0.0.0:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notepatch}
      POSTGRES_USER: ${POSTGRES_USER:-notepatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notepatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notepatch} -d ${POSTGRES_DB:-notepatch}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs-master:
    image: chrislusf/seaweedfs:4.38
    restart: unless-stopped
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0
    volumes:
      - seaweedfs_master:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.38
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -ip.bind=0.0.0.0 -port=8080
    depends_on:
      - seaweedfs-master
    volumes:
      - seaweedfs_volume:/data

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.38
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -ip.bind=0.0.0.0
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    volumes:
      - seaweedfs_filer:/data

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.38
    restart: unless-stopped
    command: s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333 -config=/etc/seaweedfs/s3_config.json
    depends_on:
      - seaweedfs-filer
    ports:
      - "0.0.0.0:8333:8333"
    volumes:
      - ./infra/seaweedfs/s3_config.json:/etc/seaweedfs/s3_config.json:ro

  tusd:
    image: tusproject/tusd:v2
    restart: unless-stopped
    user: "0:0"
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/files/
      - -behind-proxy
      - -upload-dir=/data
      - -disable-download
      - -max-size=${UPLOAD_MAX_BYTES:-209715200}
      - -hooks-http=http://api:8000/api/v1/webhooks/tusd?secret=${TUSD_WEBHOOK_SECRET:-change-me-tusd-webhook-secret}
      - -hooks-enabled-events=post-create,post-finish,post-terminate
    ports:
      - "0.0.0.0:1080:1080"
    volumes:
      - tusd_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: notepatch-server_postgres_data
  seaweedfs_master:
    name: notepatch-server_seaweedfs_master
  seaweedfs_volume:
    name: notepatch-server_seaweedfs_volume
  seaweedfs_filer:
    name: notepatch-server_seaweedfs_filer
  tusd_data:
    name: notepatch-server_tusd_data
  paddleocr-cache:
    name: notepatch-server_paddleocr-cache
  bge-cache:
    name: notepatch-server_bge-cache
  clamav-data:
    name: notepatch-server_clamav-data
  prometheus-data:
    name: notepatch-server_prometheus-data
  grafana-data:
    name: notepatch-server_grafana-data
